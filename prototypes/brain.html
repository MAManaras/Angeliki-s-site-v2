<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brain prototype</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      background: radial-gradient(ellipse at center, #FDF8F3 0%, #F2E6D6 60%, #E8D7BF 100%);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    #stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
    }
    .holder {
      position: relative;
      width: min(72vmin, 560px);
      aspect-ratio: 1 / 1;
    }
    .halo {
      position: absolute; inset: 6%;
      background: radial-gradient(
        circle at center,
        rgba(31, 24, 20, 0.62) 0%,
        rgba(31, 24, 20, 0.36) 28%,
        rgba(31, 24, 20, 0.14) 48%,
        rgba(31, 24, 20, 0.00) 65%
      );
      pointer-events: none;
    }
    .brain {
      position: relative; z-index: 1; width: 100%; height: 100%;
    }
    .brain canvas {
      display: block; width: 100% !important; height: 100% !important;
    }
    #title {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      color: #87513A; font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; opacity: 0.75; pointer-events: none;
    }
    #status {
      position: fixed; top: 18px; left: 18px;
      color: #998878; font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; opacity: 0.55;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="title">Brain prototype</div>
  <div id="status">loading…</div>
  <div id="stage">
    <div class="holder">
      <div class="halo"></div>
      <div class="brain" id="brainCanvas"></div>
    </div>
  </div>

  <script type="module">
    import { initBrain } from '../js/brain.js?v=8';
    initBrain(document.getElementById('brainCanvas'));
    document.getElementById('status').textContent = 'live';
  </script>
</body>
</html>
